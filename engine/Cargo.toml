[package]
name = "fever-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fever's audio engine, compiled to WebAssembly and run in an AudioWorklet"

[lib]
# cdylib = the .wasm loaded by the browser; rlib = lets `cargo test` link the crate natively.
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
